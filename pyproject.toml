[project]
name = "aegis"
version = "0.1.0"
requires-python = ">=3.14.7"
dependencies = [
    "colorama==0.4.6",
    "fastapi>=0.141.1",
    "flask>=3.1.3",
    "numpy==2.5.1",
    "pandas==3.0.5",
    "pillow>=12.3.0",
    "pyautogui>=0.9.54",
    "pyqtgraph==0.14.0",
    "pyrect==0.2.0",
    "pyscreeze==1.0.1",
    "pyside6==6.11.1",
    "pyside6-addons==6.11.1",
    "pyside6-essentials==6.11.1",
    "pytest==9.1.1",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "pythonnet==3.1.0",
    "pytweening==1.2.0",
    "pywebview==6.2.1",
    "pywin32>=312",
    "requests==2.34.2",
    "shiboken6==6.11.1",
    "six==1.17.0",
    "telethon>=1.45.0",
    "types-pyautogui>=0.9.3.20260508",
    "types-pywin32>=312.0.0.20260827",
    "tzdata==2026.3",
    "uvicorn==0.52.1",
    "websocket-client==1.9.0",
]

[tool.uv]
package = false

[tool.pyrefly]
disable-search-path-heuristics = true
search-path = [".", "src"]

[tool.pyright]
extraPaths = [".", "src"]
